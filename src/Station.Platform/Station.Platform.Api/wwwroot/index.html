<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>监控管理平台</title>
    <style>
        body { font-family: 'Segoe UI', 'PingFang SC', sans-serif; margin: 24px; color: #1e293b; }
        table { border-collapse: collapse; width: 100%; font-size: 13px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px 8px; text-align: left; }
        th { background: #f1f5f9; }
        input, select, button { padding: 6px 10px; margin-right: 6px; }
        video { max-width: 480px; max-height: 270px; }
        .tab { padding: 8px 18px; cursor: pointer; border: 1px solid #cbd5e1; background: #f8fafc; margin-right: 4px; }
        .tab.active { background: #0a2f6c; color: #fff; }
        .section { margin-top: 12px; }
        .card { border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px 16px; min-width: 130px; text-align: center; background: #f8fafc; }
    </style>
</head>
<body>
    <h2>监控管理平台（M20 最小前端）</h2>
    <div id="loginBar" style="margin-bottom:10px;">
        <input id="loginUser" placeholder="账号" style="width:120px;">
        <input id="loginPass" placeholder="密码" type="password" style="width:120px;">
        <button onclick="login()">登录</button>
        <span id="loginMsg" style="color:#dc2626;"></span>
        <span id="userInfo" style="margin-left:12px;"></span>
        <button id="logoutBtn" onclick="logout()" style="display:none;">退出</button>
    </div>
    <div>
        <span class="tab active" id="tab-files" onclick="switchTab('files')">文件列表</span>
        <span class="tab" id="tab-alerts" onclick="switchTab('alerts')">报警管理</span>
        <span class="tab" id="tab-stations" onclick="switchTab('stations')">采集站授权</span>
        <span class="tab" id="tab-commands" onclick="switchTab('commands')">远程指令</span>
        <span class="tab" id="tab-stats" onclick="switchTab('stats')">统计报表</span>
    </div>

    <!-- 文件列表 -->
    <div class="section" id="sec-files">
        <input id="keyword" placeholder="文件名/编号/记录仪关键字">
        <select id="kind"><option value="">全部类型</option><option value="0">视频</option><option value="1">音频</option><option value="2">图片</option><option value="3">其他</option></select>
        <select id="deptFilter" style="display:none;"><option value="">全部部门</option></select>
        <button onclick="loadFiles(1)">查询</button>
        <span id="fileSummary"></span>
        <table id="fileTable" style="margin-top:8px;"><thead><tr><th>编号</th><th>文件名</th><th>类型</th><th>大小</th><th>采集时间</th><th>记录仪</th><th>用户</th><th>部门</th><th>操作</th></tr></thead><tbody></tbody></table>
        <div style="margin-top:12px;display:none;" id="player"><video id="video" controls></video><p id="playHint" style="font-size:12px;color:#64748b;"></p></div>
    </div>

    <!-- 报警管理 -->
    <div class="section" id="sec-alerts" style="display:none;">
        <input id="alertStation" placeholder="采集站ID" style="width:120px;">
        <select id="alertLevel"><option value="">全部级别</option><option value="0">信息</option><option value="1">警告</option><option value="2">严重</option></select>
        <button onclick="loadAlerts(1)">查询</button>
        <span id="alertSummary"></span>
        <table id="alertTable" style="margin-top:8px;"><thead><tr><th>ID</th><th>站</th><th>级别</th><th>类型</th><th>来源</th><th>内容</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody></tbody></table>
    </div>

    <!-- 采集站授权 -->
    <div class="section" id="sec-stations" style="display:none;">
        <button onclick="loadStations()">刷新</button>
        <span id="stationSummary"></span>
        <table id="stationTable" style="margin-top:8px;"><thead><tr><th>站ID</th><th>站编号</th><th>系统</th><th>架构</th><th>版本</th><th>授权状态</th><th>到期时间</th><th>剩余天数</th><th>部门</th><th>操作</th><th>注册时间</th></tr></thead><tbody></tbody></table>
    </div>

    <!-- 远程指令 -->
    <div class="section" id="sec-commands" style="display:none;">
        <input id="cmdStation" placeholder="采集站ID" style="width:140px;">
        <select id="cmdType"><option value="0">重启服务</option><option value="1">清理缓存</option><option value="2">重拉配置</option><option value="3">执行自检</option><option value="4">停止采集</option><option value="5">启动采集</option></select>
        <button onclick="dispatch()">下发指令</button>
        <span id="cmdMsg"></span>
        <table id="cmdTable" style="margin-top:10px;"><thead><tr><th>指令ID</th><th>类型</th><th>状态</th><th>结果</th><th>下发时间</th></tr></thead><tbody></tbody></table>
    </div>

    <!-- 统计报表 -->
    <div class="section" id="sec-stats" style="display:none;">
        <div id="overviewCards" style="display:flex;gap:12px;flex-wrap:wrap;"></div>
        <h4>采集趋势（近 14 天）</h4>
        <table id="trendTable"><thead><tr><th>日期</th><th>文件数</th><th>容量</th><th>趋势</th></tr></thead><tbody></tbody></table>
        <h4>采集排行</h4>
        <table id="stationStatTable"><thead><tr><th>站</th><th>部门</th><th>文件数</th><th>容量</th><th>报警数</th><th>最后采集</th><th>在线</th></tr></thead><tbody></tbody></table>
        <h4>报警统计</h4>
        <table id="alertLevelTable" style="display:inline-table;margin-right:20px;"><thead><tr><th>级别</th><th>数量</th></tr></thead><tbody></tbody></table>
        <table id="alertStatusTable" style="display:inline-table;margin-right:20px;"><thead><tr><th>状态</th><th>数量</th></tr></thead><tbody></tbody></table>
        <table id="alertTypeTable" style="display:inline-table;"><thead><tr><th>类型</th><th>数量</th></tr></thead><tbody></tbody></table>
    </div>

    <script>
        const KINDS = ['视频', '音频', '图片', '其他'];
        const ALERT_LEVELS = ['信息', '警告', '严重'];
        const ALERT_TYPES = ['磁盘不足', '网络中断', 'USB故障', '校验失败', '非授权接入', '绑定异常', '存储不可达', '授权到期'];
        const LICENSE_STATUS = ['试用', '宽限', '已激活', '锁定'];
        const CMD_TYPES = ['重启服务', '清理缓存', '重拉配置', '执行自检', '停止采集', '启动采集'];
        const CMD_STATUS = ['待下发', '已拉取', '执行中', '成功', '失败', '超时'];
        const ALERT_STATUS = ['待处理', '已确认', '已处理', '已关闭'];
        let currentSession = null;
        let DEPTS = [];

        function deptName(id) {
            if (!id) return '';
            const d = DEPTS.find(x => x.id === id);
            return d ? d.name : String(id);
        }

        async function loadDepts() {
            const sel = document.getElementById('deptFilter');
            if (!currentSession || !currentSession.permissions.includes('dept:view')) {
                sel.style.display = 'none';
                return;
            }
            const resp = await fetch('/api/v1/depts');
            if (!resp.ok) { sel.style.display = 'none'; return; }
            const body = await resp.json();
            DEPTS = body.data || [];
            sel.innerHTML = '<option value="">全部部门</option>' +
                DEPTS.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            sel.style.display = '';
        }

        async function login() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            const resp = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userName: user, password: pass })
            });
            if (!resp.ok) { document.getElementById('loginMsg').textContent = '登录失败'; return; }
            const body = await resp.json();
            currentSession = body.session;
            document.getElementById('loginMsg').textContent = '';
            document.getElementById('userInfo').textContent = `当前用户：${body.session.userName}（${body.session.roles.join(',')}）`;
            document.getElementById('logoutBtn').style.display = '';
            await loadDepts();
            loadFiles(1);
            loadAlerts(1);
        }

        async function logout() {
            await fetch('/api/v1/auth/logout', { method: 'POST' });
            currentSession = null;
            DEPTS = [];
            document.getElementById('userInfo').textContent = '';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('deptFilter').style.display = 'none';
        }

        async function setAlertStatus(id, status) {
            const resp = await fetch(`/api/v1/alerts/${id}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            if (resp.status === 403) { document.getElementById('alertSummary').textContent = '无报警处置权限'; return; }
            loadAlerts(1);
        }

        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            ['files', 'alerts', 'stations', 'commands', 'stats'].forEach(s =>
                document.getElementById('sec-' + s).style.display = s === name ? '' : 'none');
            if (name === 'alerts') loadAlerts(1);
            if (name === 'stations') loadStations();
            if (name === 'stats') loadStats();
        }

        async function loadFiles(page) {
            const kw = document.getElementById('keyword').value.trim();
            const kind = document.getElementById('kind').value;
            const deptId = document.getElementById('deptFilter').value;
            const q = new URLSearchParams({ page, size: 20 });
            if (kw) q.set('keyword', kw);
            if (kind !== '') q.set('kind', kind);
            if (deptId) q.set('deptId', deptId);
            const resp = await fetch('/api/v1/files?' + q.toString());
            if (resp.status === 401) { document.getElementById('loginMsg').textContent = '请先登录'; return; }
            const body = await resp.json();
            const data = body.data;
            if (!data) return;
            document.getElementById('fileSummary').textContent = `共 ${data.totalCount} 条`;
            const tbody = document.querySelector('#fileTable tbody');
            tbody.innerHTML = '';
            data.items.forEach(f => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${f.fileNo}</td><td>${f.fileName}</td><td>${KINDS[f.kind]}</td>
                    <td>${(f.size/1048576).toFixed(1)}MB</td><td>${f.collectedAt}</td>
                    <td>${f.recorderSerial}</td><td>${f.userNo||''}</td><td>${f.deptCode||''}</td>
                    <td><button onclick="preview('${f.fileNo}','${f.fileName}')">预览</button></td>`;
                tbody.appendChild(tr);
            });
        }

        async function loadAlerts(page) {
            const stationId = document.getElementById('alertStation').value.trim();
            const level = document.getElementById('alertLevel').value;
            const q = new URLSearchParams({ page, size: 50 });
            if (stationId) q.set('stationId', stationId);
            if (level !== '') q.set('level', level);
            const resp = await fetch('/api/v1/alerts?' + q.toString());
            if (resp.status === 401) { document.getElementById('loginMsg').textContent = '请先登录'; return; }
            const body = await resp.json();
            const data = body.data;
            if (!data) return;
            document.getElementById('alertSummary').textContent = `共 ${data.totalCount} 条`;
            const tbody = document.querySelector('#alertTable tbody');
            tbody.innerHTML = '';
            data.items.forEach(a => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${a.id}</td><td>${a.stationId}</td><td>${ALERT_LEVELS[a.level]}</td>
                    <td>${ALERT_TYPES[a.type]}</td><td>${a.source}</td><td>${a.message}</td>
                    <td>${ALERT_STATUS[a.status]}</td><td>${a.occurredAt}</td>
                    <td><button onclick="setAlertStatus(${a.id},1)">确认</button>
                        <button onclick="setAlertStatus(${a.id},2)">处理</button>
                        <button onclick="setAlertStatus(${a.id},3)">关闭</button></td>`;
                tbody.appendChild(tr);
            });
        }

        async function loadStations() {
            const resp = await fetch('/api/v1/stations?page=1&size=50');
            if (resp.status === 401) { document.getElementById('loginMsg').textContent = '请先登录'; return; }
            const body = await resp.json();
            const data = body.data;
            if (!data) return;
            document.getElementById('stationSummary').textContent = `共 ${data.totalCount} 个采集站`;
            const tbody = document.querySelector('#stationTable tbody');
            tbody.innerHTML = '';
            const canManage = currentSession && currentSession.permissions.includes('station:manage');
            const deptOptions = DEPTS.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            data.items.forEach(s => {
                const tr = document.createElement('tr');
                const deptCell = canManage
                    ? `<select id="deptSel-${s.stationId}">${deptOptions}</select>`
                    : deptName(s.deptId);
                const opCell = canManage
                    ? `<button onclick="assignDept(${s.stationId})">保存</button>`
                    : '';
                tr.innerHTML = `<td>${s.stationId}</td><td>${s.stationCode}</td><td>${s.osVersion}</td>
                    <td>${s.cpuArch}</td><td>${s.softwareVersion}</td>
                    <td>${LICENSE_STATUS[s.licenseStatus]}</td><td>${s.licenseExpiresAt||''}</td>
                    <td>${s.licenseDaysLeft}</td><td>${deptCell}</td><td>${opCell}</td><td>${s.registeredAt}</td>`;
                tbody.appendChild(tr);
            });
        }

        async function assignDept(stationId) {
            const deptId = Number(document.getElementById('deptSel-' + stationId).value) || null;
            const resp = await fetch(`/api/v1/stations/${stationId}/dept`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deptId })
            });
            if (!resp.ok) {
                const body = await resp.json().catch(() => ({}));
                document.getElementById('stationSummary').textContent = body.message || '调整失败';
                return;
            }
            document.getElementById('stationSummary').textContent = '归属已更新';
            loadStations();
        }

        function preview(fileNo, name) {
            document.getElementById('player').style.display = 'block';
            const video = document.getElementById('video');
            video.src = `/api/v1/files/${fileNo}/preview`;
            document.getElementById('playHint').textContent = `${name}：H.264 在线播放；H.265 请下载后播放`;
            video.play().catch(() => {});
        }

        async function dispatch() {
            const stationId = document.getElementById('cmdStation').value.trim();
            const type = Number(document.getElementById('cmdType').value);
            const resp = await fetch(`/api/v1/stations/${stationId}/commands`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type })
            });
            const body = await resp.json();
            document.getElementById('cmdMsg').textContent = body.message + (body.data ? `，指令ID=${body.data.commandId}` : '');
            loadCommands();
        }

        async function loadCommands() {
            const stationId = document.getElementById('cmdStation').value.trim();
            if (!stationId) return;
            const resp = await fetch(`/api/v1/stations/${stationId}/commands`);
            if (resp.status === 401) { document.getElementById('loginMsg').textContent = '请先登录'; return; }
            const body = await resp.json();
            if (!body.data) return;
            const tbody = document.querySelector('#cmdTable tbody');
            tbody.innerHTML = '';
            (body.data || []).forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${c.commandId}</td><td>${CMD_TYPES[c.type]}</td>
                    <td>${CMD_STATUS[c.status]}</td><td>${c.message||''}</td><td>${c.issuedAt||''}</td>`;
                tbody.appendChild(tr);
            });
        }

        function fmtSize(bytes) {
            if (!bytes) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let v = bytes, i = 0;
            while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
            return v.toFixed(1) + ' ' + units[i];
        }

        async function loadStats() {
            const resp = await fetch('/api/v1/stats/overview');
            if (resp.status === 401) { document.getElementById('loginMsg').textContent = '请先登录'; return; }
            if (!resp.ok) { document.getElementById('overviewCards').textContent = '无统计查看权限'; return; }
            const o = (await resp.json()).data;
            document.getElementById('overviewCards').innerHTML =
                `<div class="card"><b>${o.stationCount}</b><br>采集站（在线 ${o.onlineCount} / 离线 ${o.offlineCount}）</div>
                 <div class="card"><b>${o.fileCount}</b><br>文件总数</div>
                 <div class="card"><b>${fmtSize(o.totalSize)}</b><br>存储总量</div>
                 <div class="card"><b>${o.todayFileCount}</b><br>今日采集（${fmtSize(o.todaySize)}）</div>
                 <div class="card"><b>${o.videoCount}</b><br>视频文件</div>
                 <div class="card"><b>${o.pendingAlertCount}</b><br>待处理报警 / ${o.alertCount}</div>`;
            loadTrend();
            loadStationStats();
            loadAlertStats();
        }

        async function loadTrend() {
            const resp = await fetch('/api/v1/stats/collection-trend?days=14');
            if (!resp.ok) return;
            const points = (await resp.json()).data;
            const max = Math.max(1, ...points.map(p => p.fileCount));
            document.querySelector('#trendTable tbody').innerHTML = points.map(p =>
                `<tr><td>${p.date.slice(0, 10)}</td><td>${p.fileCount}</td><td>${fmtSize(p.size)}</td>
                 <td><div style="background:#0a2f6c;height:12px;width:${Math.round(p.fileCount / max * 100)}%;"></div></td></tr>`).join('');
        }

        async function loadStationStats() {
            const resp = await fetch('/api/v1/stats/stations?page=1&size=50');
            if (!resp.ok) return;
            const data = (await resp.json()).data;
            document.querySelector('#stationStatTable tbody').innerHTML = data.items.map(s =>
                `<tr><td>${s.stationCode}</td><td>${s.deptName || ''}</td><td>${s.fileCount}</td>
                 <td>${fmtSize(s.totalSize)}</td><td>${s.alertCount}</td><td>${s.lastCollectedAt || ''}</td>
                 <td>${s.isOnline ? '在线' : '离线'}</td></tr>`).join('');
        }

        async function loadAlertStats() {
            const resp = await fetch('/api/v1/stats/alerts');
            if (!resp.ok) return;
            const a = (await resp.json()).data;
            document.querySelector('#alertLevelTable tbody').innerHTML =
                a.byLevel.map(x => `<tr><td>${ALERT_LEVELS[Number(x.key)]}</td><td>${x.count}</td></tr>`).join('');
            document.querySelector('#alertStatusTable tbody').innerHTML =
                a.byStatus.map(x => `<tr><td>${ALERT_STATUS[Number(x.key)]}</td><td>${x.count}</td></tr>`).join('');
            document.querySelector('#alertTypeTable tbody').innerHTML =
                a.byType.map(x => `<tr><td>${ALERT_TYPES[Number(x.key)]}</td><td>${x.count}</td></tr>`).join('');
        }

        document.getElementById('fileSummary').textContent = '请先登录后查看';
    </script>
</body>
</html>
