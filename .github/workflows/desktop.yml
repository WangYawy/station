name: Desktop

on:
  push:
    paths:
      - 'src/Station.Shared/**'
      - 'src/Station.Desktop/**'
      - 'station-web/**'
      - 'Station.Desktop.sln'
      - 'Directory.Build.props'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src/Station.Shared/**'
      - 'src/Station.Desktop/**'
      - 'station-web/**'
      - 'Station.Desktop.sln'
      - 'Directory.Build.props'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Station.Desktop.sln
      - run: dotnet build Station.Desktop.sln -c Release --no-restore

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Station.Desktop.sln
      - run: dotnet build Station.Desktop.sln -c Release --no-restore

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: station-web/package-lock.json
      - run: npm ci
        working-directory: station-web
      - run: npm run build
        working-directory: station-web
