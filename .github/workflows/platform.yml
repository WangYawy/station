name: Platform

on:
  push:
    paths:
      - 'src/Station.Shared/**'
      - 'src/Station.Platform/**'
      - 'station-platform-web/**'
      - 'packages/**'
      - 'Station.Platform.sln'
      - 'Directory.Build.props'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/platform.yml'
  pull_request:
    paths:
      - 'src/Station.Shared/**'
      - 'src/Station.Platform/**'
      - 'station-platform-web/**'
      - 'packages/**'
      - 'Station.Platform.sln'
      - 'Directory.Build.props'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Station.Platform.sln
      - run: dotnet build Station.Platform.sln -c Release --no-restore

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter station-platform-web build
