# 金仓（Kingbase）部署：平台 API 容器连接外部金仓（金仓通常部署在国产主机，不建议容器化）。
# 启动前在 .env 中配置 KINGBASE_CONNECTION，并将 API 容器加入金仓所在网络或使用宿主机地址。
name: station-platform-kingbase

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/platform/Dockerfile
    image: station-platform-api:0.1.0
    restart: unless-stopped
    ports:
      - "${PLATFORM_HTTP_PORT:-5100}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      STATION__DB__PROVIDER: Kingbase
      STATION__DB__CONNECTIONSTRING: "${KINGBASE_CONNECTION}"
      STATION__AUTH__DEFAULTADMINUSERNAME: "${ADMIN_USERNAME:-admin}"
      STATION__AUTH__DEFAULTADMINPASSWORD: "${ADMIN_PASSWORD:-Admin@123}"
      PLATFORM__COMMAND__PRIVATEKEYPEM: "${PLATFORM_COMMAND_PRIVATE_KEY:-}"
      PLATFORM__REPORTING__PUBLICKEYPEM: "${PLATFORM_REPORTING_PUBLIC_KEY:-}"
      STATION__BACKUP__BACKUPDIRECTORY: /app/backups
      STATION__BACKUP__RETENTIONCOUNT: "${BACKUP_RETENTION:-30}"
    volumes:
      - backups:/app/backups

volumes:
  backups:
